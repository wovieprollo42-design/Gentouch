<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GenTouch">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63C800"/>
      <stop offset="1" stop-color="#2F7D00"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#g)"/>

  <!-- The G, drawn as an open ring with the logo's leaf sprout -->
  <path d="M43 22.5a14 14 0 1 0 2.5 12H33"
        fill="none" stroke="#FFFFFF" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf, echoing the mark -->
  <path d="M27.5 13.5c-4.6 0-7.5 2.9-7.5 7.2 4.6 0 7.5-2.9 7.5-7.2Z" fill="#C6ED96"/>

  <!-- Fingerprint ridges in the accent red -->
  <g fill="none" stroke="#E51B16" stroke-width="3" stroke-linecap="round">
    <path d="M38 40.5a6 6 0 0 1 9 0"/>
    <path d="M35.5 46.5a10 10 0 0 1 14 0"/>
  </g>
</svg>
